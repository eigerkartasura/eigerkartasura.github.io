# Menyalin katalog pelanggan dari repo Basecamp (hub-toko-2299) ke situs ini.
# Berjalan otomatis tiap jam; sumber kode tetap di repo Basecamp, jangan edit file situs di sini.
# Daftar berkas yang disalin ada di katalog/berkas.txt (repo Basecamp): baris "<sumber> <tujuan>".
name: Salin katalog

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/salin-katalog.yml']

permissions:
  contents: write

concurrency:
  group: salin-katalog
  cancel-in-progress: true

jobs:
  salin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil katalog terbaru
        run: |
          set -euo pipefail
          SUMBER=https://raw.githubusercontent.com/alishobrun/hub-toko-2299/main
          curl -fsSL "$SUMBER/katalog/berkas.txt" -o /tmp/berkas.txt
          grep -v '^\s*#' /tmp/berkas.txt | while read -r src dst; do
            [ -z "${src:-}" ] && continue
            case "$dst" in /*|*..*) echo "lewati $dst"; continue;; esac
            mkdir -p "$(dirname "$dst")"
            curl -fsSL "$SUMBER/$src" -o "$dst"
          done
          # jalur aset relatif: katalog ada di akar situs ini
          sed -i 's#\.\./assets/#assets/#g' index.html
          touch .nojekyll
      - name: Simpan bila berubah
        run: |
          git config user.name "katalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Tidak ada perubahan"; exit 0; }
          git commit -m "Perbarui katalog dari Basecamp"
          git push
